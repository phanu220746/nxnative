
name: Check GitHub Actions Disk Space

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-disk:
    name: Inspect macOS Runner Storage
    runs-on: xcode-27
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Runner Information
        shell: bash
        run: |
          set -uo pipefail

          echo "================================"
          echo " GITHUB ACTIONS RUNNER INFO"
          echo "================================"

          echo ""
          echo "=== macOS Version ==="
          sw_vers

          echo ""
          echo "=== CPU Architecture ==="
          uname -m

          echo ""
          echo "=== Xcode Version ==="
          xcodebuild -version

          echo ""
          echo "=== Runner Environment ==="
          echo "RUNNER_TEMP: $RUNNER_TEMP"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"

      - name: Check Disk Space Before Analysis
        shell: bash
        run: |
          set -uo pipefail

          echo "================================"
          echo " DISK SPACE BEFORE ANALYSIS"
          echo "================================"

          echo ""
          echo "=== All Mounted Volumes ==="
          df -h

          echo ""
          echo "=== Root Volume ==="
          df -h /

          echo ""
          echo "=== Runner Temporary Directory ==="
          df -h "$RUNNER_TEMP"

          echo ""
          echo "=== GitHub Workspace ==="
          df -h "$GITHUB_WORKSPACE"

          FREE_KB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          FREE_GB=$(awk -v kb="$FREE_KB" \
            'BEGIN {printf "%.2f", kb/1024/1024}')

          TOTAL_KB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $2}')
          TOTAL_GB=$(awk -v kb="$TOTAL_KB" \
            'BEGIN {printf "%.2f", kb/1024/1024}')

          echo ""
          echo "================================"
          echo " STORAGE SUMMARY"
          echo "================================"
          echo "Total disk: ${TOTAL_GB} GB"
          echo "Available disk: ${FREE_GB} GB"

          {
            echo "## GitHub Actions Disk Report"
            echo ""
            echo "| Item | Result |"
            echo "|---|---:|"
            echo "| Runner | xcode-27 |"
            echo "| Total disk | ${TOTAL_GB} GB |"
            echo "| Available disk | ${FREE_GB} GB |"
            echo ""
            echo "### Full disk information"
            echo '```text'
            df -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Build Space Requirement
        shell: bash
        run: |
          set -uo pipefail

          FREE_KB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          FREE_GB=$(awk -v kb="$FREE_KB" \
            'BEGIN {printf "%.2f", kb/1024/1024}')

          echo "Available space: ${FREE_GB} GB"

          if [ "$FREE_KB" -lt $((18 * 1024 * 1024)) ]; then
            echo "::warning::Less than 18 GB free."
            echo "Runner may not have enough storage for Naruto Storm 4."
          else
            echo "At least 18 GB is available."
          fi

      - name: Analyze Runner Home Storage
        shell: bash
        run: |
          set -uo pipefail

          echo "=== RUNNER HOME TOP LEVEL ==="
          du -xhd 1 /Users/runner 2>/dev/null | sort -h

      - name: Analyze Library Storage
        shell: bash
        run: |
          set -uo pipefail

          echo "=== LIBRARY BREAKDOWN ==="
          du -xhd 1 /Users/runner/Library 2>/dev/null | sort -h

          echo ""
          echo "=== XCODE / DEVELOPER STORAGE ==="
          du -xhd 2 /Users/runner/Library/Developer 2>/dev/null \
            | sort -h | tail -40

      - name: Analyze Xcode Storage
        shell: bash
        run: |
          set -uo pipefail

          echo "=== XCODE STORAGE DETAILS ==="

          for p in \
            /Users/runner/Library/Developer/Xcode/DerivedData \
            /Users/runner/Library/Developer/Xcode/Archives \
            "/Users/runner/Library/Developer/Xcode/iOS DeviceSupport" \
            /Users/runner/Library/Developer/CoreSimulator \
            /Applications/Xcode.app
          do
            if [ -e "$p" ]; then
              echo ""
              echo "--- $p ---"
              du -sh "$p" 2>/dev/null || true
            else
              echo "NOT FOUND: $p"
            fi
          done

      - name: Analyze Cache Storage
        shell: bash
        run: |
          set -uo pipefail

          echo "=== CACHE BREAKDOWN ==="
          du -xhd 2 /Users/runner/Library/Caches 2>/dev/null \
            | sort -h | tail -50

          echo ""
          echo "=== PACKAGE CACHES ==="

          for p in \
            /Users/runner/Library/Caches/pip \
            /Users/runner/Library/Caches/Homebrew \
            /opt/homebrew/var/cache \
            /Users/runner/.cache \
            /Users/runner/.yarn \
            /Users/runner/.gradle/caches \
            /Users/runner/.npm
          do
            if [ -e "$p" ]; then
              du -sh "$p" 2>/dev/null || true
            else
              echo "NOT FOUND: $p"
            fi
          done

      - name: Analyze Toolchain Storage
        shell: bash
        run: |
          set -uo pipefail

          echo "=== TOOLCHAIN STORAGE ==="

          for p in \
            /Users/runner/hostedtoolcache \
            /Users/runner/.dotnet \
            /opt/homebrew \
            /Applications/Xcode.app \
            /Library/Developer/CommandLineTools
          do
            if [ -e "$p" ]; then
              du -sh "$p" 2>/dev/null || true
            else
              echo "NOT FOUND: $p"
            fi
          done

      - name: Analyze Workspace and Temporary Files
        shell: bash
        run: |
          set -uo pipefail

          echo "=== WORKSPACE STORAGE ==="
          du -xhd 2 "$GITHUB_WORKSPACE" 2>/dev/null \
            | sort -h | tail -40

          echo ""
          echo "=== RUNNER TEMPORARY DIRECTORY ==="
          du -xhd 2 "$RUNNER_TEMP" 2>/dev/null \
            | sort -h | tail -40

      - name: Find Large Files
        shell: bash
        run: |
          set -uo pipefail

          echo "=== TOP 50 FILES LARGER THAN 100 MB ==="

          find /Users/runner -xdev -type f -size +100M \
            -exec du -h {} + 2>/dev/null \
            | sort -h | tail -50

      - name: Final Disk Space Report
        shell: bash
        run: |
          set -uo pipefail

          echo "================================"
          echo " FINAL DISK SPACE"
          echo "================================"

          df -h
          echo ""
          df -Pk "$RUNNER_TEMP"

          FREE_KB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          FREE_GB=$(awk -v kb="$FREE_KB" \
            'BEGIN {printf "%.2f", kb/1024/1024}')

          echo ""
          echo "Available after analysis: ${FREE_GB} GB"

          {
            echo ""
            echo "## Final Storage Report"
            echo ""
            echo "- Available disk after analysis: **${FREE_GB} GB**"
            echo ""
            echo '```text'
            df -h
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "================================"
          echo " ANALYSIS COMPLETE"
          echo " READ ONLY - NOTHING DELETED"
          echo "================================"
