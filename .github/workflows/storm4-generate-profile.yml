
      - name: Generate provisional profile
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import importlib.util
          import struct
          from pathlib import Path

          root = Path.cwd()
          temp = Path(os.environ["RUNNER_TEMP"])
          game_dir = temp / "storm4"
          exefs = game_dir / "ExeFS"
          romfs = game_dir / "RomFS.img"
          control = game_dir / "control.nacp"

          sys.path.insert(0, str(root / "dm/tools"))
          sys.path.insert(0, str(root / "dm/games"))

          import profile_guess as pg
          import nacp

          # 1. Verify required input files.
          for path in (
              exefs / "main",
              exefs / "main.npdm",
              romfs,
              control,
          ):
              if not path.is_file():
                  raise FileNotFoundError(
                      f"Required game file missing: {path}"
                  )

          # 2. Verify executable identity.
          npdm = (exefs / "main.npdm").read_bytes()

          if npdm[:4] != b"META":
              raise RuntimeError("Invalid NPDM: META header missing")

          pos = npdm.find(b"ACI0")

          if pos < 0:
              raise RuntimeError("Invalid NPDM: ACI0 missing")

          title_id = struct.unpack_from(
              "<Q", npdm, pos + 0x10
          )[0]

          expected = 0x01003F800CF5C000

          if title_id != expected:
              raise RuntimeError(
                  f"Wrong Title ID: {title_id:016X}"
              )

          print(f"Verified Title ID: {title_id:016X}")

          # 3. Analyze the actual ExeFS and ROMFS.
          print("Analyzing ExeFS and ROMFS...")

          F = pg.facts_of(exefs, romfs)

          print("Modules:", ", ".join(sorted(F["mods"])))
          print("ROMFS files:", F["romfs"]["n"])
          print("ROMFS bytes:", F["romfs"]["bytes"])

          # 4. Import NXNative's original profile writer.
          builder_path = root / "scripts/build_ipa_from_nsp.py"

          spec = importlib.util.spec_from_file_location(
              "nxnative_builder", builder_path
          )

          if spec is None or spec.loader is None:
              raise RuntimeError(
                  "Cannot load NXNative profile builder"
              )

          builder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(builder)

          # The writer refers to pg as a module global.
          builder.pg = pg

          # 5. Build the exact data structure expected by
          #    NXNative write_profile(pdir, app, f).
          profile_data = {
              "F": F,
              "name": nacp.name(control) or "Naruto Storm 4",
              "display": nacp.version(control) or "Base Game",
              "version": "v0",
              "survey": "Generated from verified existing dump",
          }

          # 6. Generate the provisional profile.
          profile = (
              temp / "profile" / f"{title_id:016X}"
          )

          print("Generating provisional profile...")
          print("Output:", profile)

          builder.write_profile(
              profile,
              title_id,
              profile_data
          )

          # 7. Verify every expected output before upload.
          expected_files = [
              "game.tsv",
              *builder.EMPTY_TABLES.keys(),
          ]

          for filename in expected_files:
              output = profile / filename

              if not output.is_file():
                  raise RuntimeError(
                      f"Profile output missing: {filename}"
                  )

              if output.stat().st_size == 0:
                  raise RuntimeError(
                      f"Profile output is empty: {filename}"
                  )

              print(
                  f"Verified: {filename} "
                  f"({output.stat().st_size} bytes)"
              )

          print("\n=== PROFILE GENERATED SUCCESSFULLY ===")
          print("Title ID:", f"{title_id:016X}")
          print("Name:", profile_data["name"])
          print("Version:", profile_data["version"])
          print("Display:", profile_data["display"])
          print("Profile:", profile)

          print("\n=== GAME.TSV ===")
          print((profile / "game.tsv").read_text())

          print("\n=== PROFILE TABLES ===")

          for path in sorted(profile.glob("*.tsv")):
              print(path.name, path.stat().st_size, "bytes")

          PY
