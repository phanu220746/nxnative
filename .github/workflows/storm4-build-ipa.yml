
name: Naruto Storm 4 - Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout NXNative
        uses: actions/checkout@v4

      - name: Free up disk space (macOS)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          xcrun simctl delete unavailable || true
          rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true

          brew cleanup --prune=all || true
          rm -rf ~/Library/Caches/Homebrew/* || true
          rm -rf ~/Library/Caches/pip/* || true

          sudo rm -rf /usr/local/share/boost || true

          echo "=== Disk space after cleanup ==="
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check Xcode and Metal Toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Install build dependencies
        run: |
          brew install xcodegen zstd glslang

          dotnet --version
          xcodegen --version

          python -m pip install --upgrade pip
          python -m pip install \
            lz4 \
            capstone \
            fonttools \
            nsz \
            "backports.zstd; python_version < '3.14'"

      - name: Install Google Drive downloader
        run: |
          python -m pip install gdown

      - name: Prepare prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          set -euo pipefail

          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is missing"
            exit 1
          fi

          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"

          echo "prod.keys prepared"

      # Download the existing extracted Dump first.
      # This avoids keeping both the ZIP and NSP on disk at the same time.
      - name: Download existing Naruto Storm 4 Dump
        run: |
          set -euo pipefail

          FILE_ID="1DzcDUo5lP_sHDuDiB832QuyLzltzLU6N"

          mkdir -p "$RUNNER_TEMP/dump-download"

          echo "Downloading existing Dump ZIP..."

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O "$RUNNER_TEMP/naruto-dump.zip" \
            --retries 3 \
            --timeout 120

          test -s "$RUNNER_TEMP/naruto-dump.zip"

          echo "Dump ZIP downloaded:"
          ls -lh "$RUNNER_TEMP/naruto-dump.zip"

          echo "Extracting Dump ZIP..."

          unzip -q "$RUNNER_TEMP/naruto-dump.zip" \
            -d "$RUNNER_TEMP/dump-download"

          DUMP_ROOT="$RUNNER_TEMP/dump-download/NarutoStorm4"

          if [ ! -f "$DUMP_ROOT/ExeFS/main" ]; then
            echo "ERROR: ExeFS/main not found in Dump ZIP"
            find "$RUNNER_TEMP/dump-download" -maxdepth 4 -print
            exit 1
          fi

          if [ ! -f "$DUMP_ROOT/RomFS.img" ]; then
            echo "ERROR: RomFS.img not found in Dump ZIP"
            exit 1
          fi

          echo "Dump ZIP structure verified"

      # Place the existing Dump where NXNative checks its extraction cache.
      - name: Prepare NXNative extraction cache
        run: |
          set -euo pipefail

          GAME_DIR="$RUNNER_TEMP/storm4"
          CACHE_DIR="$GAME_DIR/01003F800CF5C000_build/extract/v0"
          DUMP_ROOT="$RUNNER_TEMP/dump-download/NarutoStorm4"

          mkdir -p "$CACHE_DIR"

          cp -R "$DUMP_ROOT/." "$CACHE_DIR/"

          echo "=== Cached Dump structure ==="
          ls -lah "$CACHE_DIR"
          ls -lah "$CACHE_DIR/ExeFS"

          test -f "$CACHE_DIR/ExeFS/main"
          test -f "$CACHE_DIR/RomFS.img"
          test -f "$CACHE_DIR/control.nacp"

          echo "NXNative cache files are present"

      # NXNative uses the same RomFS reader to validate the marker.
      - name: Validate cached RomFS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "dm/tools")
          import romfs

          dump = Path(
              "$RUNNER_TEMP/01003F800CF5C000_build/extract/v0"
          )
          PY
        env:
          RUNNER_TEMP: ${{ runner.temp }}

      # Delete the ZIP and temporary extraction folder to save disk space.
      - name: Remove temporary Dump ZIP
        run: |
          set -euo pipefail

          rm -f "$RUNNER_TEMP/naruto-dump.zip"
          rm -rf "$RUNNER_TEMP/dump-download"

          echo "Temporary ZIP removed"
          df -h

      - name: Download Naruto Storm 4 NSP
        run: |
          set -euo pipefail

          FILE_ID="1X3iMtcMhmxRyuVOAomSDJyRGdbjoSOa5"

          mkdir -p "$RUNNER_TEMP/storm4"

          echo "Downloading Naruto Storm 4 NSP..."

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O "$RUNNER_TEMP/storm4/NarutoStorm4.nsp" \
            --retries 3 \
            --timeout 120

          test -s "$RUNNER_TEMP/storm4/NarutoStorm4.nsp"

          SIZE=$(stat -f%z "$RUNNER_TEMP/storm4/NarutoStorm4.nsp")

          echo "NSP size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000000 ]; then
            echo "NSP file is too small"
            exit 1
          fi

          MAGIC=$(head -c 4 "$RUNNER_TEMP/storm4/NarutoStorm4.nsp")

          if [ "$MAGIC" != "PFS0" ]; then
            echo "Invalid NSP container"
            exit 1
          fi

          echo "NSP validation passed"

      - name: Build unsigned iOS IPA
        run: |
          set -euo pipefail

          python3 scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/storm4" \
            -k "$RUNNER_TEMP/prod.keys" \
            --title-id 01003F800CF5C000 \
            -o "$RUNNER_TEMP/NarutoStorm4.ipa" \
            --romfs separate \
            --keep-extracted \
            --progress lines \
            2>&1 | tee "$RUNNER_TEMP/storm4-build.log"

          echo "Checking whether NXNative reused the existing Dump..."

          if ! grep -qi "reusing the extracted" "$RUNNER_TEMP/storm4-build.log"; then
            echo "ERROR: NXNative did not report reuse of the existing Dump"
            exit 1
          fi

          test -s "$RUNNER_TEMP/NarutoStorm4.ipa"

          echo "IPA build completed"
          ls -lh "$RUNNER_TEMP/NarutoStorm4.ipa"

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Storm4-iOS-IPA
          path: ${{ runner.temp }}/NarutoStorm4.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build logs and profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Storm4-Build-Logs
          path: |
            ${{ runner.temp }}/storm4-build.log
            ${{ runner.temp }}/storm4/01003F800CF5C000_build/logs/
            ${{ runner.temp }}/storm4/01003F800CF5C000_build/profile/
            ${{ runner.temp }}/storm4/01003F800CF5C000_survey/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove sensitive temporary files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/prod.keys"

          echo "Temporary sensitive files removed"
          
      - name: Validate cached RomFS
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "dm/tools")
          import romfs

          dump = Path(
              __import__("os").environ["RUNNER_TEMP"]
          ) / "storm4/01003F800CF5C000_build/extract/v0"

          if not (dump / "ExeFS/main").is_file():
              raise SystemExit("Missing ExeFS/main")

          if not (dump / "RomFS.img").is_file():
              raise SystemExit("Missing RomFS.img")

          root = romfs.source(dump)
          marker = root / "data/sim/stage2.cpk"

          if not marker.exists():
              raise SystemExit(
                  f"RomFS marker not found: {marker}"
              )

          print("RomFS marker verified:", marker)
          print("Existing Dump is ready for NXNative reuse")
          PY

