name: Naruto Storm 4 - Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Checkout NXNative
        uses: actions/checkout@v4

      - name: Free up disk space (macOS)
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h

          echo "Deleting unavailable iOS simulators..."
          xcrun simctl delete unavailable || true
          rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true

          echo "Cleaning Homebrew cache..."
          brew cleanup --prune=all || true
          rm -rf ~/Library/Caches/Homebrew/* || true
          rm -rf ~/Library/Caches/pip/* || true

          echo "Removing unneeded large directories..."
          sudo rm -rf /usr/local/share/boost || true

          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check Xcode and Metal Toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Install build dependencies
        run: |
          brew install xcodegen zstd glslang

          dotnet --version
          xcodegen --version

          python -m pip install --upgrade pip
          python -m pip install \
            lz4 \
            capstone \
            fonttools \
            nsz \
            "backports.zstd; python_version < '3.14'"

      - name: Install Google Drive downloader
        run: |
          python -m pip install gdown

      - name: Prepare prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is missing"
            exit 1
          fi

          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"

          echo "prod.keys prepared"

      - name: Download Naruto Storm 4 NSP
        run: |
          set -euo pipefail

          FILE_ID="1axB1GqjfoXcF4kZ9qhv1o5cnfAu2O7UG"

          gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O "$RUNNER_TEMP/storm4.nsp" \
            --retries 3 \
            --timeout 60

          test -s "$RUNNER_TEMP/storm4.nsp"

          SIZE=$(stat -f%z "$RUNNER_TEMP/storm4.nsp")

          echo "NSP size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000000 ]; then
            echo "NSP file is too small"
            exit 1
          fi

          MAGIC=$(head -c 4 "$RUNNER_TEMP/storm4.nsp")

          if [ "$MAGIC" != "PFS0" ]; then
            echo "Invalid NSP container"
            exit 1
          fi

          echo "NSP validation passed"

      - name: Prepare game folder
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/storm4"

          # ใช้ mv แทน cp เพื่อประหยัดพื้นที่ดิสก์
          mv "$RUNNER_TEMP/storm4.nsp" \
            "$RUNNER_TEMP/storm4/NarutoStorm4.nsp"

          ls -lh "$RUNNER_TEMP/storm4/"

      - name: Build unsigned iOS IPA
        run: |
          set -euo pipefail

          python3 scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/storm4" \
            -k "$RUNNER_TEMP/prod.keys" \
            --title-id 01003F800CF5C000 \
            -o "$RUNNER_TEMP/NarutoStorm4.ipa" \
            --romfs separate \
            --progress lines

          test -s "$RUNNER_TEMP/NarutoStorm4.ipa"

          echo "IPA build completed"

          ls -lh "$RUNNER_TEMP/NarutoStorm4.ipa"

      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Storm4-iOS-IPA
          path: ${{ runner.temp }}/NarutoStorm4.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload build logs and profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Storm4-Build-Logs
          path: |
            ${{ runner.temp }}/storm4/01003F800CF5C000_build/logs/
            ${{ runner.temp }}/storm4/01003F800CF5C000_build/profile/
            ${{ runner.temp }}/storm4/01003F800CF5C000_survey/
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove sensitive temporary files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/prod.keys"
          rm -f "$RUNNER_TEMP/storm4.nsp"

          echo "Temporary sensitive files removed"
