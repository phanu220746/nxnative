name: Build Pokémon Z-A IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          uname -m
          df -h

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --break-system-packages \
            lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Verify Z-A profile
        run: |
          test -d dm/games/0100F43008C44000
          echo "Pokémon Legends: Z-A profile found"

      - name: Check packer
        run: |
          python3 scripts/build_ipa_from_nsp.py --help