name: nxnative IPA Build Test

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Mac environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          df -h

      - name: Install dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk

      - name: Install Python dependencies
        run: |
          python3 -m pip install --user --break-system-packages \
            lz4 capstone fonttools "backports.zstd; python_version < '3.14'"

      - name: Check nxnative packer
        run: |
          python3 scripts/build_ipa_from_nsp.py --help

      - name: Check IPA builder
        run: |
          test -x dm/ios/tools/build_ipa.sh
          echo "IPA builder is ready"