name: Storm 4 - Survey Game Profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout NXNative
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            gdown \
            lz4 \
            "capstone>=5,<6" \
            fonttools \
            backports.zstd

      - name: Prepare prod.keys
        env:
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          if [ -z "$PROD_KEYS" ]; then
            echo "PROD_KEYS secret is empty"
            exit 1
          fi

          printf '%s' "$PROD_KEYS" > "$RUNNER_TEMP/prod.keys"
          chmod 600 "$RUNNER_TEMP/prod.keys"
          echo "prod.keys prepared"

      - name: Download Naruto Storm 4 NSP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storm4-nsp"

          FILE_ID="1X3iMtcMhmxRyuVOAomSDJyRGdbjoSOa5"
          NSP="$RUNNER_TEMP/storm4-nsp/Naruto Storm 4 [01003F800CF5C000].nsp"

          echo "Trying Google Drive download with gdown..."
          if ! gdown \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O "$NSP" \
            --retries 3 \
            --timeout 60; then

            echo "gdown failed. Trying direct Google Drive download..."
            rm -f "$NSP"

            curl -fL \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 60 \
              -A "Mozilla/5.0" \
              "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
              -o "$NSP"
          fi

          if [ ! -s "$NSP" ]; then
            echo "NSP download failed: file is missing or empty"
            exit 1
          fi

          SIZE=$(stat -c%s "$NSP")
          echo "Downloaded size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000000 ]; then
            echo "NSP file is too small; download may be an HTML warning page"
            file "$NSP" || true
            exit 1
          fi

          MAGIC=$(head -c 4 "$NSP")
          if [ "$MAGIC" != "PFS0" ]; then
            echo "Invalid NSP/PFS0 file; download may be an HTML page or incomplete"
            file "$NSP" || true
            exit 1
          fi

          echo "NSP validation passed"
          ls -lh "$NSP"

      - name: Diagnose Naruto NSP
        run: |
          set -euo pipefail
          echo "=== NSP folder ==="
          ls -lah "$RUNNER_TEMP/storm4-nsp"

          echo "=== NSP header and title tag check ==="
          python - "$RUNNER_TEMP/storm4-nsp" <<'PY'
          import re
          import sys
          from pathlib import Path

          folder = Path(sys.argv[1])
          extensions = {".nsp", ".xci", ".nsz", ".xcz"}
          found = False

          for p in sorted(folder.iterdir()):
              if not p.is_file() or p.suffix.lower() not in extensions:
                  continue
              found = True
              with p.open("rb") as f:
                  header = f.read(0x104)
              tagged_id = re.search(r"\[([0-9A-Fa-f]{16})\]", p.name)
              print(f"FILE: {p.name}")
              print(f"SIZE: {p.stat().st_size} bytes")
              print(f"PFS0: {header[:4] == b'PFS0'}")
              print(f"XCI: {header[0x100:0x104] == b'HEAD'}")
              print(f"TITLE_ID_IN_FILENAME: {tagged_id.group(1) if tagged_id else 'not found'}")

          if not found:
              raise SystemExit("No NSP/XCI/NSZ/XCZ file found in the expected folder")
          PY

      - name: Survey Naruto Storm 4
        run: |
          python scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/storm4-nsp" \
            -k "$RUNNER_TEMP/prod.keys" \
            --survey-only \
            --progress lines

      - name: Upload Survey Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Storm4-Survey
          path: |
            ${{ runner.temp }}/storm4-nsp/01003F800CF5C000_survey/survey.md
            ${{ runner.temp }}/storm4-nsp/01003F800CF5C000_survey/logs/*.log
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn

      - name: Remove temporary sensitive files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/prod.keys"
          rm -f "$RUNNER_TEMP/storm4-nsp/"*.nsp
          echo "Temporary sensitive files removed"
