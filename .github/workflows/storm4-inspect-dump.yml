
name: Naruto Storm 4 - Inspect Existing Dump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner storage
        run: |
          echo "=== Disk space ==="
          df -h
          echo "=== Workspace ==="
          du -sh "$GITHUB_WORKSPACE" || true

      - name: Install Google Drive downloader
        run: |
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/gdown-venv/bin/pip" install gdown
          "$RUNNER_TEMP/gdown-venv/bin/gdown" --version

      - name: Download Naruto Storm 4 ZIP
        env:
          FILE_ID: 1xO7unR0DIehYuVKzLvH5s0h4KxyCtw4z
        run: |
          set -euo pipefail

          ZIP_PATH="$RUNNER_TEMP/NarutoStorm4.zip"

          echo "Downloading Naruto Storm 4 dump..."
          "$RUNNER_TEMP/gdown-venv/bin/gdown" \
            "$FILE_ID" \
            -O "$ZIP_PATH"

          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::Downloaded ZIP is missing or empty"
            exit 1
          fi

          echo "=== Downloaded file ==="
          ls -lh "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Inspect ZIP, NPDM and RomFS header
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import zipfile
          import struct

          zip_path = os.environ["ZIP_PATH"]

          print("=== ZIP validation ===")

          if not zipfile.is_zipfile(zip_path):
              print("ERROR: Downloaded file is not a valid ZIP")
              sys.exit(1)

          with zipfile.ZipFile(zip_path) as z:
              names = z.namelist()

              for name in names:
                  print(name)

              def find_file(target):
                  matches = [
                      n for n in names
                      if n.replace("\\", "/").endswith(target)
                  ]
                  if not matches:
                      print(f"ERROR: Missing {target}")
                      sys.exit(1)
                  if len(matches) > 1:
                      print(f"WARNING: Multiple matches for {target}: {matches}")
                  return matches[0]

              main_name = find_file("exefs/main")
              npdm_name = find_file("exefs/main.npdm")
              romfs_name = find_file("RomFS.img")

              print("\n=== NSO main validation ===")
              main = z.read(main_name)

              print("File:", main_name)
              print("Size:", len(main))
              print("Magic:", main[:4])

              if main[:4] != b"NSO0":
                  print("ERROR: main is not an NSO0 executable")
                  sys.exit(1)

              print("NSO0: OK")

              print("\n=== NPDM validation ===")
              npdm = z.read(npdm_name)

              print("File:", npdm_name)
              print("Size:", len(npdm))
              print("Magic:", npdm[:4])

              if npdm[:4] != b"META":
                  print("WARNING: NPDM does not begin with META")

              aci0_offset = npdm.find(b"ACI0")

              if aci0_offset >= 0 and len(npdm) >= aci0_offset + 0x18:
                  title_id = struct.unpack_from(
                      "<Q", npdm, aci0_offset + 0x10
                  )[0]
                  print("Title ID:", f"{title_id:016X}")
              else:
                  print("WARNING: ACI0 or Title ID not found")

              print("\n=== RomFS image validation ===")
              romfs = z.read(romfs_name)

              print("File:", romfs_name)
              print("Size:", len(romfs))
              print("Magic:", romfs[:8])

              if len(romfs) < 32:
                  print("ERROR: RomFS image is smaller than header")
                  sys.exit(1)

              magic, index_offset, index_size, entry_count = struct.unpack(
                  "<8sQQQ", romfs[:32]
              )

              print("Magic:", magic)
              print("Index offset:", index_offset)
              print("Index size:", index_size)
              print("Entry count:", entry_count)

              if magic != b"DMROMFS1":
                  print("ERROR: RomFS image does not use DMROMFS1 format")
                  sys.exit(1)

              if index_offset < 32 or index_offset > len(romfs):
                  print("ERROR: Invalid index offset")
                  sys.exit(1)

              if index_size > len(romfs) - index_offset:
                  print("ERROR: Invalid index size")
                  sys.exit(1)

              print("\n=== RESULT ===")
              print("ZIP: VALID")
              print("NSO main: VALID")
              print("NPDM: INSPECTED")
              print("RomFS header: VALID")
              print("Dump inspection completed successfully.")
          PY
