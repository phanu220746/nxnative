
name: Naruto Storm 4 - Inspect Existing Dump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner storage
        run: |
          set -euo pipefail

          echo "=== RUNNER INFORMATION ==="
          uname -a
          python3 --version

          echo ""
          echo "=== AVAILABLE DISK SPACE ==="
          df -h "$RUNNER_TEMP"

      - name: Install Google Drive downloader
        run: |
          set -euo pipefail

          python3 -m venv "$RUNNER_TEMP/gdown-venv"

          "$RUNNER_TEMP/gdown-venv/bin/python" \
            -m pip install --upgrade pip

          "$RUNNER_TEMP/gdown-venv/bin/python" \
            -m pip install gdown

          "$RUNNER_TEMP/gdown-venv/bin/gdown" --version

      - name: Download Naruto Storm 4 ZIP
        run: |
          set -euo pipefail

          FILE_ID="1xO7unR0DIehYuVKzLvH5s0h4KxyCtw4z"
          ZIP_PATH="$RUNNER_TEMP/NarutoStorm4.zip"

          echo "Starting Google Drive download..."

          "$RUNNER_TEMP/gdown-venv/bin/gdown" \
            "https://drive.google.com/uc?id=${FILE_ID}" \
            -O "$ZIP_PATH" \
            --fuzzy

          test -s "$ZIP_PATH"

          echo ""
          echo "=== DOWNLOAD RESULT ==="
          ls -lh "$ZIP_PATH"

          echo ""
          echo "=== DISK SPACE AFTER DOWNLOAD ==="
          df -h "$RUNNER_TEMP"

      - name: Inspect ZIP, NPDM and RomFS header
        env:
          ZIP_PATH: ${{ runner.temp }}/NarutoStorm4.zip
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import zipfile
          import struct

          path = os.environ["ZIP_PATH"]

          print("ZIP path:", path)

          if not os.path.isfile(path):
              raise RuntimeError("ZIP file not found")

          with zipfile.ZipFile(path) as z:
              files = z.infolist()

              print("\n=== ZIP CONTENTS ===")

              for f in files:
                  print(f"{f.file_size:>15} bytes  {f.filename}")

              def locate(name):
                  matches = [
                      f for f in files
                      if f.filename.rstrip("/").endswith(name)
                  ]

                  if len(matches) != 1:
                      raise RuntimeError(
                          f"Expected exactly one {name}, "
                          f"found {len(matches)}"
                      )

                  return matches[0]

              main = locate("exefs/main")
              npdm = locate("exefs/main.npdm")
              romfs = locate("RomFS.img")

              print("\n=== EXEFS MAIN ===")

              with z.open(main) as f:
                  magic = f.read(4)

              print("Magic:", magic)

              if magic != b"NSO0":
                  raise RuntimeError(
                      "main is not a valid NSO0 module"
                  )

              print("NSO main: OK")

              print("\n=== NPDM / TITLE ID ===")

              with z.open(npdm) as f:
                  data = f.read()

              if data[:4] != b"META":
                  raise RuntimeError(
                      "main.npdm does not start with META"
                  )

              aci = data.find(b"ACI0")

              if aci < 0 or aci + 0x18 > len(data):
                  raise RuntimeError(
                      "ACI0 section not found in main.npdm"
                  )

              title_id = struct.unpack_from(
                  "<Q", data, aci + 0x10
              )[0]

              print(f"Detected Title ID: {title_id:016X}")
              print("NPDM: OK")

              print("\n=== ROMFS IMAGE ===")

              print("File size:", romfs.file_size)

              with z.open(romfs) as f:
                  header = f.read(32)

              if len(header) != 32:
                  raise RuntimeError(
                      "RomFS header is incomplete"
                  )

              magic, index_offset, index_size, count = (
                  struct.unpack("<8sQQQ", header)
              )

              print("Header hex:", header.hex())
              print("Magic:", magic)
              print("Index offset:", index_offset)
              print("Index size:", index_size)
              print("Entry count:", count)

              if magic != b"DMROMFS1":
                  raise RuntimeError(
                      "RomFS magic is not DMROMFS1"
                  )

              if index_offset < 32:
                  raise RuntimeError(
                      "Invalid index offset"
                  )

              if index_offset > romfs.file_size:
                  raise RuntimeError(
                      "Index offset exceeds image size"
                  )

              if index_size != romfs.file_size - index_offset:
                  raise RuntimeError(
                      "RomFS image size/index mismatch"
                  )

              if count == 0:
                  raise RuntimeError(
                      "RomFS contains zero entries"
                  )

              if index_size < count * 24:
                  raise RuntimeError(
                      "RomFS index is too small"
                  )

              print("NXNative RomFS header: OK")

              print("\n=== RESULT ===")
              print("ZIP structure: OK")
              print("NSO main: OK")
              print("NPDM: OK")
              print("RomFS image: OK")
              print("Initial validation passed.")
          PY
