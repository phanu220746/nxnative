
name: Naruto Storm 4 - Inspect Existing Dump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner storage
        run: |
          echo "=== Disk space ==="
          df -h
          echo "=== Workspace ==="
          du -sh "$GITHUB_WORKSPACE" || true

      - name: Install Google Drive downloader
        run: |
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/gdown-venv/bin/pip" install gdown
          "$RUNNER_TEMP/gdown-venv/bin/gdown" --version

      - name: Download Naruto Storm 4 ZIP
        env:
          FILE_ID: 1xO7unR0DIehYuVKzLvH5s0h4KxyCtw4z
        run: |
          set -euo pipefail

          ZIP_PATH="$RUNNER_TEMP/NarutoStorm4.zip"

          echo "Downloading Naruto Storm 4 dump..."

          "$RUNNER_TEMP/gdown-venv/bin/gdown" \
            "$FILE_ID" \
            -O "$ZIP_PATH"

          if [ ! -s "$ZIP_PATH" ]; then
            echo "::error::Downloaded ZIP is missing or empty"
            exit 1
          fi

          echo "=== Downloaded file ==="
          ls -lh "$ZIP_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Inspect ZIP, ExeFS, NPDM and RomFS
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys
          import zipfile
          import struct

          zip_path = os.environ["ZIP_PATH"]

          print("=== ZIP validation ===")

          if not zipfile.is_zipfile(zip_path):
              print("ERROR: Downloaded file is not a valid ZIP")
              sys.exit(1)

          with zipfile.ZipFile(zip_path) as z:
              names = z.namelist()

              print("\n=== ZIP contents ===")
              for name in names:
                  print(name)

              # Normalize paths and ignore case differences.
              normalized = {
                  name.replace("\\", "/").strip("/").lower(): name
                  for name in names
                  if not name.endswith("/")
              }

              def find_file(target):
                  key = target.replace("\\", "/").strip("/").lower()

                  matches = [
                      original
                      for normalized_name, original in normalized.items()
                      if normalized_name == key
                      or normalized_name.endswith("/" + key)
                  ]

                  if not matches:
                      print(f"ERROR: Missing {target}")
                      sys.exit(1)

                  if len(matches) > 1:
                      print(
                          f"ERROR: Multiple matches for {target}: {matches}"
                      )
                      sys.exit(1)

                  return matches[0]

              main_name = find_file("exefs/main")
              npdm_name = find_file("exefs/main.npdm")
              romfs_name = find_file("romfs.img")

              print("\n=== NSO main validation ===")

              main_info = z.getinfo(main_name)

              print("File:", main_name)
              print("Uncompressed size:", main_info.file_size)

              with z.open(main_name) as f:
                  main_magic = f.read(4)

              print("Magic:", main_magic)

              if main_magic != b"NSO0":
                  print("ERROR: main is not an NSO0 executable")
                  sys.exit(1)

              print("NSO0: OK")

              print("\n=== NPDM validation ===")

              npdm_info = z.getinfo(npdm_name)

              print("File:", npdm_name)
              print("Uncompressed size:", npdm_info.file_size)

              with z.open(npdm_name) as f:
                  npdm = f.read()

              print("Magic:", npdm[:4])

              if npdm[:4] != b"META":
                  print("ERROR: NPDM does not begin with META")
                  sys.exit(1)

              aci0_offset = npdm.find(b"ACI0")

              if aci0_offset < 0:
                  print("ERROR: ACI0 not found in NPDM")
                  sys.exit(1)

              if len(npdm) < aci0_offset + 0x18:
                  print("ERROR: NPDM is too small for Title ID")
                  sys.exit(1)

              title_id = struct.unpack_from(
                  "<Q", npdm, aci0_offset + 0x10
              )[0]

              print("Title ID:", f"{title_id:016X}")

              print("\n=== RomFS image validation ===")

              romfs_info = z.getinfo(romfs_name)

              print("File:", romfs_name)
              print("Uncompressed size:", romfs_info.file_size)

              if romfs_info.file_size < 32:
                  print("ERROR: RomFS image is smaller than header")
                  sys.exit(1)

              with z.open(romfs_name) as f:
                  header = f.read(32)

              magic, index_offset, index_size, entry_count = struct.unpack(
                  "<8sQQQ", header
              )

              print("Magic:", magic)
              print("Index offset:", index_offset)
              print("Index size:", index_size)
              print("Entry count:", entry_count)

              if magic != b"DMROMFS1":
                  print("ERROR: Unexpected RomFS image format")
                  sys.exit(1)

              if index_offset < 32:
                  print("ERROR: Invalid index offset")
                  sys.exit(1)

              if index_offset > romfs_info.file_size:
                  print("ERROR: Index offset exceeds file size")
                  sys.exit(1)

              if index_size > romfs_info.file_size - index_offset:
                  print("ERROR: Index size exceeds file boundary")
                  sys.exit(1)

              if entry_count == 0:
                  print("WARNING: RomFS contains zero entries")

              print("\n=== RESULT ===")
              print("ZIP: VALID")
              print("ExeFS main: VALID")
              print("NPDM: VALID")
              print("Title ID:", f"{title_id:016X}")
              print("RomFS header: VALID")
              print("Dump inspection completed successfully.")

          PY
